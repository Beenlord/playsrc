<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phone — Sender</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <main>
        <h1>Phone — Sender</h1>
        <p id="session-display"></p>


        <label for="file">Choose video from phone</label>
        <input id="file" type="file" accept="video/*" />


        <div>
            <button id="play">Start streaming</button>
        </div>


        <h2>Local preview</h2>
        <video id="localPreview" controls playsinline></video>
    </main>


    <script type="module" src="/main_phone.js" defer></script>
</body>

</html>
